<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leo's Lerninsel — Gefühle entdecken</title>
<meta name="description" content="Eine sanfte Lern-App für Kinder: Gefühle verstehen, sich mitteilen und zur Ruhe kommen.">
<meta name="theme-color" content="#FFE8D6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --sky:#BFE3F0;
  --sky-deep:#8FCBE0;
  --peach:#FFDDBE;
  --peach-deep:#FFC79A;
  --mint:#CBEBD6;
  --mint-deep:#A6DCBB;
  --sun:#FFF0B0;
  --sun-deep:#FFE178;
  --berry:#FFB6A6;
  --berry-deep:#FF9C86;
  --ink:#4A4358;
  --ink-soft:#736C82;
  --paper:#FFFBF4;
  --paper-2:#FFF6E8;
  --line: rgba(74,67,88,0.10);
  --accent: var(--peach-deep);
  --accent-soft: var(--peach);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --shadow: 0 10px 24px rgba(74,67,88,0.10);
  --shadow-soft: 0 4px 12px rgba(74,67,88,0.08);
  font-size: clamp(15px, 1.1vw + 10px, 19px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito', sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--sky) 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, var(--sun) 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
h1,h2,h3,.display{
  font-family:'Baloo 2', sans-serif;
  font-weight:700;
  line-height:1.15;
  margin:0;
}
button{font-family:inherit;}
img,svg{display:block;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:3px solid var(--sky-deep); outline-offset:3px; border-radius:8px;}

/* ============ LAYOUT SHELL ============ */
#app{
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  padding: max(12px, env(safe-area-inset-top)) 18px 12px;
  background: linear-gradient(180deg, var(--paper) 78%, transparent);
  backdrop-filter: blur(6px);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{width:40px; height:40px; border-radius:14px; background:var(--peach); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft); flex-shrink:0;}
.brand-text{font-family:'Baloo 2'; font-weight:800; font-size:1.15rem; color:var(--ink);}
.brand-text small{display:block; font-family:'Nunito'; font-weight:600; font-size:0.62rem; letter-spacing:.06em; color:var(--ink-soft); text-transform:uppercase;}

.icon-btn{
  border:none; background:#fff; width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft);
  cursor:pointer; transition:transform .15s ease;
  font-size:1.2rem;
}
.icon-btn:active{transform:scale(0.9);}

main#view{
  flex:1;
  padding: 6px 18px calc(100px + env(safe-area-inset-bottom));
  width:100%;
}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:720px; margin:0 auto;
  display:flex; justify-content:space-around; align-items:center;
  background:#fff;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -6px 20px rgba(74,67,88,0.08);
  border-radius: 26px 26px 0 0;
}
.nav-btn{
  border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-soft); font-weight:700; font-size:0.68rem; padding:6px 14px; border-radius:16px; cursor:pointer;
  transition: background .15s ease, color .15s ease;
}
.nav-btn .glyph{font-size:1.35rem;}
.nav-btn.active{color:var(--ink); background:var(--paper-2);}

/* ============ REUSABLE ============ */
.card{
  background:#fff; border-radius:var(--radius-lg); padding:22px;
  box-shadow:var(--shadow); margin-bottom:18px;
}
.section-title{font-size:1.35rem; margin-bottom:4px;}
.section-sub{color:var(--ink-soft); font-weight:600; font-size:0.92rem; margin-bottom:18px;}

.btn{
  border:none; cursor:pointer; font-family:'Baloo 2'; font-weight:700;
  border-radius:999px; padding:14px 26px; font-size:1rem;
  background:var(--accent); color:var(--ink);
  box-shadow: 0 6px 0 rgba(0,0,0,0.08);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.08);}
.btn.secondary{background:#fff; box-shadow:0 6px 0 var(--line);}
.btn.block{width:100%; text-align:center;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.choice{
  border:4px solid transparent; background:var(--paper-2); border-radius:var(--radius-md);
  padding:16px 12px; text-align:center; cursor:pointer; font-weight:700; font-family:'Baloo 2';
  display:flex; flex-direction:column; align-items:center; gap:8px; font-size:0.95rem;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.choice:active{transform:scale(0.96);}
.choice.correct{border-color:var(--mint-deep); background:var(--mint);}
.choice.wrong{border-color:var(--berry-deep); background:var(--berry); opacity:.75;}
.choice .emoji{font-size:2.1rem;}
.choice .emoji-lg{font-size:2.8rem;}

.progress-track{height:10px; border-radius:999px; background:var(--paper-2); overflow:hidden; margin:10px 0 18px;}
.progress-fill{height:100%; background:var(--mint-deep); border-radius:999px; transition:width .4s ease;}

.module-card{
  display:flex; align-items:center; gap:16px; cursor:pointer;
  border-radius:var(--radius-lg); padding:18px; margin-bottom:14px;
  box-shadow:var(--shadow); transition:transform .15s ease;
}
.module-card:active{transform:scale(0.98);}
.module-icon{
  width:58px; height:58px; border-radius:18px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1.8rem;
}
.module-title{font-family:'Baloo 2'; font-weight:700; font-size:1.08rem;}
.module-desc{color:var(--ink-soft); font-size:0.85rem; font-weight:600;}
.chevron{margin-left:auto; color:var(--ink-soft); font-size:1.3rem;}

/* ---- Insel-Karte (Startbildschirm) ---- */
.island-map{ position:relative; width:100%; aspect-ratio: 4 / 3; margin-bottom:16px; }
.island-bg{
  position:absolute; inset:0; border-radius:32px; overflow:hidden;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
  box-shadow: var(--shadow);
}
.island-bg svg{ width:100%; height:100%; display:block; }
.station{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:none; border:none; cursor:pointer; padding:4px;
}
.station-bubble{
  width:clamp(56px,14vw,82px); height:clamp(56px,14vw,82px);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.5rem,4vw,2.15rem);
  box-shadow:0 8px 18px rgba(74,67,88,0.22);
  border:4px solid #fff;
  animation: stationBob 3.6s ease-in-out infinite;
  transition: transform .15s ease;
}
.station:active .station-bubble{ transform:scale(0.9); }
.station-label{
  font-family:'Baloo 2'; font-weight:700; font-size:0.72rem;
  background:#fff; padding:4px 11px; border-radius:999px;
  box-shadow:var(--shadow-soft); color:var(--ink); white-space:nowrap;
}
@keyframes stationBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){ .station-bubble{animation:none;} }

.feedback-banner{
  border-radius:var(--radius-md); padding:16px 18px; font-weight:700; font-family:'Baloo 2';
  display:flex; align-items:center; gap:10px; margin-top:16px; font-size:1rem;
}
.feedback-banner.good{background:var(--mint); color:#2E5A40;}
.feedback-banner.gentle{background:var(--sun); color:#6B5410;}

.avatar-badge{
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; box-shadow:var(--shadow-soft); flex-shrink:0; cursor:pointer;
}

.stage{
  border-radius:var(--radius-lg); padding:26px 20px; text-align:center; box-shadow:var(--shadow);
}
.mascot-lg{font-size:4.2rem; margin-bottom:6px; animation: bob 3.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.breath-circle{
  width:180px; height:180px; border-radius:50%; margin:24px auto;
  background: radial-gradient(circle at 35% 30%, #fff, var(--sky-deep));
  display:flex; align-items:center; justify-content:center;
  font-family:'Baloo 2'; font-weight:700; color:var(--ink); font-size:1.1rem;
  box-shadow: 0 0 0 14px rgba(143,203,224,0.25);
  transition: transform 4s ease-in-out;
}
.breath-circle.in{transform:scale(1.35);}
.breath-circle.out{transform:scale(1);}

.sticker-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:12px;}
.sticker{
  aspect-ratio:1; border-radius:20px; display:flex; align-items:center; justify-content:center;
  font-size:2rem; background:var(--paper-2); box-shadow:var(--shadow-soft);
}
.sticker.locked{opacity:.25; filter:grayscale(1);}

.step-dots{display:flex; gap:8px; justify-content:center; margin-bottom:22px;}
.step-dots span{width:9px; height:9px; border-radius:50%; background:var(--line);}
.step-dots span.on{background:var(--accent-deep, var(--peach-deep));}

.field-label{font-family:'Baloo 2'; font-weight:700; font-size:1rem; margin-bottom:10px; display:block;}
.text-input{
  width:100%; border:3px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px;
  font-family:'Nunito'; font-weight:700; font-size:1.05rem; color:var(--ink); background:#fff;
}
.text-input:focus{border-color:var(--sky-deep);}

.pill-grid{display:flex; flex-wrap:wrap; gap:10px;}
.pill{
  border:3px solid var(--line); background:#fff; border-radius:999px; padding:10px 18px;
  font-family:'Baloo 2'; font-weight:700; cursor:pointer; font-size:0.95rem;
}
.pill.on{border-color:var(--ink); background:var(--paper-2);}

.avatar-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.avatar-pick{
  aspect-ratio:1; border-radius:22px; border:3px solid transparent; background:var(--paper-2);
  display:flex; align-items:center; justify-content:center; font-size:2.1rem; cursor:pointer;
}
.avatar-pick.on{border-color:var(--ink);}

.color-grid{display:flex; gap:12px; flex-wrap:wrap;}
.color-pick{width:46px; height:46px; border-radius:50%; border:3px solid transparent; cursor:pointer;}
.color-pick.on{border-color:var(--ink);}

.storypage{text-align:center;}
.storypage .scene{font-size:3.4rem; margin-bottom:14px;}
.storypage p{font-size:1.05rem; font-weight:700; line-height:1.5; color:var(--ink);}
.tip-box{background:var(--sun); border-radius:var(--radius-md); padding:14px 16px; margin-top:16px; font-weight:700; font-size:0.9rem;}

.parent-block{margin-bottom:20px;}
.parent-block h3{font-size:1.05rem; margin-bottom:8px;}
.parent-block p{color:var(--ink-soft); font-weight:600; font-size:0.92rem; line-height:1.55; margin:0;}

.hidden{display:none !important;}

@media (min-width:560px){
  .avatar-grid{grid-template-columns:repeat(4,1fr);}
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  .mascot-lg{animation:none;}
  .breath-circle{transition:none;}
  .module-card,.choice,.btn{transition:none;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="logo">🚗</div>
      <div class="brand-text">Leo's Lerninsel<small id="topbar-sub">mit Leo</small></div>
    </div>
    <button class="icon-btn" id="profileBtn" aria-label="Profil" title="Profil">🙂</button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn" data-nav="home"><span class="glyph">🏝️</span>Insel</button>
    <button class="nav-btn" data-nav="stickers"><span class="glyph">⭐</span>Sterne</button>
    <button class="nav-btn" data-nav="parents"><span class="glyph">💛</span>Eltern</button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
